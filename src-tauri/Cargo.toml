[package]
name = "coolapk_desktop"
version = "1.8.1"
description = "基于 Tauri 2、Vue 3 和 Rust 的非官方酷安桌面客户端"
authors = ["daimiaopeng"]
edition = "2024"
license = "MIT"
repository = "https://github.com/daimiaopeng/coolapk-desktop"

[lib]
name = "coolapk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify-rust = "4.18"
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "multipart"] }
tokio = { version = "1.36", features = ["full"] }
bcrypt = "0.15"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
opener = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
