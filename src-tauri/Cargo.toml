[package]
name = "coolapk_desktop"
version = "1.27.1"
description = "基于 Tauri 2、Vue 3 和 Rust 的非官方酷安桌面客户端"
authors = ["daimiaopeng"]
edition = "2024"
license = "MIT"
repository = "https://github.com/daimiaopeng/coolapk-desktop"

[lib]
name = "coolapk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "multipart", "rustls-tls"] }
tokio = { version = "1.36", features = ["full"] }
bcrypt = "0.15"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
opener = "0.7"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-stronghold = "2"
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
