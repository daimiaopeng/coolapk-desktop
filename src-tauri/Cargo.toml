[package]
name = "coolapk_desktop"
version = "1.2.1"
description = "基于 Tauri 2、Vue 3 和 Rust 的非官方酷安桌面客户端"
authors = ["daimiaopeng"]
edition = "2021"
license = "MIT"
repository = "https://github.com/daimiaopeng/coolapk-desktop"

[lib]
name = "coolapk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip"] }
tokio = { version = "1.36", features = ["full"] }
bcrypt = "0.15"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
