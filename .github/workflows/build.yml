name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: '发布 Release（仅 tag 推送时生效）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 前端测试矩阵（多代理并行） ───
  frontend-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 前端单元测试
            task: unit
          - name: 前端类型检查
            task: typecheck
          - name: 前端构建检查
            task: build
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Linux 依赖 (Tauri)
        if: matrix.task == 'build'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: 运行单元测试
        if: matrix.task == 'unit'
        run: npm test

      - name: 运行类型检查
        if: matrix.task == 'typecheck'
        run: npm run typecheck

      - name: 前端构建
        if: matrix.task == 'build'
        run: npm run build

  # ─── Rust 测试 ───
  rust-tests:
    name: Rust 测试 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: Rust 测试
        working-directory: src-tauri
        run: cargo test --lib

  # ─── 构建（仅 tag / 手动触发） ───
  build:
    name: ${{ matrix.name }}
    needs: []               # 不依赖 test；与 test 并发执行
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rustTargets: ''
            portableArch: x64
            portableTarget: ''
          - name: Windows ARM64
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rustTargets: aarch64-pc-windows-msvc
            portableArch: arm64
            portableTarget: aarch64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            rustTargets: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: 安装前端依赖
        run: npm ci

      - name: 同步标签版本号
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: 构建前端
        run: npm run build

      - name: 设置 CI 纯英文包名 (coolapk-desktop)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.productName = "coolapk-desktop";
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          '

      - name: 构建与上传产物（非 Tag 推送）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'

      - name: 发布 Release 产物（Tag 推送）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 酷安 ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: 准备 Windows 单文件便携版
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >-
          ./scripts/prepare-windows-portable.ps1
          -Architecture '${{ matrix.portableArch }}'
          -RustTarget '${{ matrix.portableTarget }}'

      - name: 上传 Windows 单文件便携版
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.portableArch }}-portable
          path: src-tauri/target/portable/*.exe
          if-no-files-found: error

      - name: 校验 macOS App 包签名
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          app_path="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS .app 产物" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign --display --verbose=4 "$app_path"

  ios-build:
    name: iOS ARM64 未签名 IPA
    needs: []
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust iOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 同步标签版本号
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: 设置 CI 纯英文包名 (coolapk-desktop)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.productName = "coolapk-desktop";
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          '

      - name: 初始化 iOS 工程
        run: npm run tauri -- ios init --ci --skip-targets-install

      - name: 构建未签名 IPA
        run: npm run tauri -- ios build --target aarch64 --no-sign --ci

      - name: 整理并校验 iOS Release 产物
        shell: bash
        run: |
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            echo "未找到 iOS IPA 产物" >&2
            exit 1
          fi

          unzip -t "$ipa"
          mkdir -p ios-release
          ref_name="${GITHUB_REF_NAME//\//-}"
          cp "$ipa" "ios-release/coolapk-${ref_name}-ios-arm64-unsigned.ipa"

      - name: 上传 iOS 未签名 IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-arm64-unsigned
          path: ios-release/*.ipa
          if-no-files-found: error

  android-build:
    name: Android ARM64 Release
    needs: []
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 平台与 NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: 安装 Rust Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 同步标签版本号
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: 准备 Android Release 签名
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "缺少 Android Release 签名 Secrets" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coolapk-upload.jks"

      - name: 构建签名 APK 和 AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coolapk-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build -- --target aarch64 --apk --aab --ci

      - name: 整理 Android Release 产物
        shell: bash
        run: |
          mkdir -p android-release
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          aab="src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab"
          test -f "$apk"
          test -f "$aab"
          verification="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk")"
          printf '%s\n' "$verification"
          grep -Fqx 'Verified using v1 scheme (JAR signing): true' <<< "$verification"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification"
          cp "$apk" "android-release/coolapk-${GITHUB_REF_NAME}-android-arm64.apk"
          cp "$aab" "android-release/coolapk-${GITHUB_REF_NAME}-android-arm64.aab"

      - name: 上传 Android Release 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64-release
          path: android-release/*
          if-no-files-found: error

  publish-android:
    name: 发布 Android APK 和 AAB
    needs: [build, android-build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 Android 产物
        uses: actions/download-artifact@v7
        with:
          name: android-arm64-release
          path: android-release

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" android-release/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-ios:
    name: 发布 iOS 未签名 IPA
    needs: [build, ios-build]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 iOS 产物
        uses: actions/download-artifact@v7
        with:
          name: ios-arm64-unsigned
          path: ios-release

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ios-release/*.ipa --repo "$GITHUB_REPOSITORY" --clobber

  publish-windows-portable:
    name: 发布 Windows 单文件便携版
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 Windows 单文件产物
        uses: actions/download-artifact@v7
        with:
          pattern: windows-*-portable
          path: portable
          merge-multiple: true

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" portable/*.exe --repo "$GITHUB_REPOSITORY"
