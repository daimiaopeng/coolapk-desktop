name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: '发布 Release（仅 tag 推送时生效）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 测试（每次推送都跑） ───
  test:
    name: 测试
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: npm ci

      - name: Rust 测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 前端构建检查
        run: npm run build

      - name: 总结
        if: success() || failure()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust 单元测试 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端构建检查 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY

  # ─── 构建（仅 tag / 手动触发） ───
  build:
    name: ${{ matrix.name }}
    needs: []               # 不依赖 test；与 test 并发执行
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis
            rustTargets: ''
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            rustTargets: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: 安装前端依赖
        run: npm ci

      - name: 同步标签版本号
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: 构建前端
        run: npm run build

      - name: 构建并上传产物（非发布）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'

      - name: 构建并发布 Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 酷安 ${{ github.ref_name }}
          releaseBody: 请在下方下载适合当前系统的安装包。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
